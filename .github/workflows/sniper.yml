name: OCI VM Sniper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-sniper

jobs:
  snipe:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_REGION: sa-saopaulo-1
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
    steps:
      - name: Instalar OCI CLI
        run: |
          pipx install oci-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verificar e tentar criar a VM
        shell: bash
        run: |
          COMPARTMENT="$OCI_CLI_TENANCY"
          EXISTING=$(oci compute instance list --compartment-id "$COMPARTMENT" --display-name "cs16-server" --query "data[?\"lifecycle-state\"!='TERMINATED'] | [0].id" --raw-output 2>/dev/null)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "✅ A cs16-server JA EXISTE! Robô aposentado, missão cumprida."
            exit 0
          fi
          echo "Sem VM ainda. Tentando criar..."
          oci compute instance launch \
            --availability-domain "DeSR:SA-SAOPAULO-1-AD-1" \
            --compartment-id "$COMPARTMENT" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --image-id "ocid1.image.oc1.sa-saopaulo-1.aaaaaaaizpqpl2y2czfobdx6igjd7j7cwtcb5zegyfgbwhp4jd5j3pea5wq" \
            --subnet-id "ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaa5uuxrjga3fm6i53xzwe4j6mjvsy7xkug3ucrmhrrbp44e6j542nwa" \
            --assign-public-ip true \
            --display-name "cs16-server" \
            --ssh-authorized-keys-file <(echo "ssh-rsa  ssh-key-2026-09-20") \
          && echo "🎉 SUCESSO! VM CRIADA! Vai lá conferir no console!"
