name: OCI VM Sniper v4

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_REGION: sa-saopaulo-1
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
    steps:
      - name: Instalar OCI CLI
        run: |
          pipx install oci-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cacar vaga por 55 minutos
        shell: bash
        run: |
          COMPARTMENT="$OCI_CLI_TENANCY"
          AD=$(oci iam availability-domain list --compartment-id "$COMPARTMENT" --query 'data[0].name' --raw-output)
          IMAGE=$(oci compute image list --compartment-id "$COMPARTMENT" --operating-system "Canonical Ubuntu" --operating-system-version "24.04 Minimal aarch64" --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC --query 'data[0].id' --raw-output)
          SUBNET=$(oci network subnet list --compartment-id "$COMPARTMENT" --display-name "subnet-20260920-1926" --query 'data[0].id' --raw-output)
          END=$((SECONDS+3300))
          COUNT=0
          while [ $SECONDS -lt $END ]; do
            COUNT=$((COUNT+1))
            echo "=== Tentativa $COUNT - $(date -u) ==="
            EXISTING=$(oci compute instance list --compartment-id "$COMPARTMENT" --display-name "cs16-server" --query "data[?\"lifecycle-state\"!='TERMINATED'] | [0].id" --raw-output 2>/dev/null)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              echo "✅ A cs16-server JA EXISTE! Missao cumprida! (relay encerrado)"
              exit 0
            fi
            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --assign-public-ip true \
              --display-name "cs16-server" \
              --ssh-authorized-keys-file <(echo "ssh-rsa  ssh-key-2026-09-20") \
              && echo "🎉 SUCESSO! VM CRIADA!" && exit 0
            echo "Sem vaga. Proxima tentativa em 60s..."
            sleep 60
          done
          echo "Turno encerrado, disparando o proximo..."

      - name: Rele - disparar o proximo turno
        if: ${{ always() }}
        run: gh workflow run sniper.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
